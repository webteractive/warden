name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          # setup-go pins GOTOOLCHAIN=local, so go.mod's toolchain floor is not
          # honoured here; without check-latest a runner's cached older patch wins.
          check-latest: true
          cache: true
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"; echo "$unformatted"
            echo "Run: gofmt -w ."
            exit 1
          fi
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race ./...

  # Kept out of the test job so a vulnerability disclosure never masks a real
  # test failure, and so this keeps reporting when the suite is red.
  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          # setup-go pins GOTOOLCHAIN=local, so go.mod's toolchain floor is not
          # honoured here; without check-latest a runner's cached older patch wins.
          check-latest: true
          cache: true
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
