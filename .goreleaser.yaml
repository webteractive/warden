# goreleaser v2 config — builds prebuilt warden binaries on a version tag.
# Validate locally with: goreleaser check
version: 2

project_name: warden

before:
  hooks:
    - go mod tidy

builds:
  - id: warden
    main: ./cmd/warden
    binary: warden
    env:
      # Static binaries with no libc dependency — this is what lets the
      # installer drop a single file onto a machine that has no Go toolchain.
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      # The injection path is checked by internal/buildinfo's test: a typo here
      # is silent and ships a binary that reports itself as "dev".
      - -s -w -X github.com/webteractive/warden/internal/buildinfo.version={{ .Version }} -X github.com/webteractive/warden/internal/buildinfo.commit={{ .FullCommit }} -X github.com/webteractive/warden/internal/buildinfo.date={{ .CommitDate }}

archives:
  - id: warden
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

changelog:
  # Built from local git history, not GitHub's compare API. `use: github` failed
  # the v0.1.1 release with a 404 on /compare/v0.1.0...v0.1.1 — v0.1.0 was the
  # first tag, so that call had never run before and the config looked fine.
  # release.yml checks out with fetch-depth: 0, so the full history is local.
  use: git
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  draft: false
  prerelease: auto
